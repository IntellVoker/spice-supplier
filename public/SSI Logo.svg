<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Definisi gradasi untuk efek premium -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#136635;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0e4f28;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4A017;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b8880e;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background oval (lebih elegan dari persegi) -->
  <ellipse cx="100" cy="100" rx="95" ry="90" fill="url(#bgGrad)"/>
  
  <!-- Border emas tipis -->
  <ellipse cx="100" cy="100" rx="90" ry="85" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
  
  <!-- Teks SPICE (putih) -->
  <text x="100" y="78" font-family="'Poppins', 'Arial', sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">SPICE</text>
  
  <!-- Teks SUPPLIER (putih) -->
  <text x="100" y="108" font-family="'Poppins', 'Arial', sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">SUPPLIER</text>
  
  <!-- Garis pemisah emas -->
  <line x1="50" y1="122" x2="150" y2="122" stroke="#D4A017" stroke-width="1.5" stroke-opacity="0.6"/>
  
  <!-- Teks INDONESIA (emas) -->
  <text x="100" y="148" font-family="'Inter', 'Arial', sans-serif" font-size="14" font-weight="600" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="3">INDONESIA</text>
  
  <!-- Tagline (putih, lebih kecil) -->
  <text x="100" y="172" font-family="'Inter', 'Arial', sans-serif" font-size="8" font-weight="400" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5" opacity="0.8">PREMIUM SPICES · TRUSTED</text>
</svg>
